<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BRÆTSPIL CAFE</title>
    <link rel="stylesheet" href="app.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet">
  </head>
  <body>
<header>
  <h1>BRÆTSPIL CAFE</h1>
  <div class="logo-container">
    <img src="img/spilcafe.logo.webp" alt="Brætspil Cafe Logo" class="logo-img">
  </div>
</header>

<main>
<!-- Hero sektion -->
<section class="hero-section">
  <div class="hero-content">
    <div class="hero-text">
      <h1>Find et spil</h1>
      <h2>Hyg dig</h2>
      <p>
        Slut med scrolling, nu skal der rulles med terninger!
        Kom forbi og få en hyggelig dag.
       </p>

       <div class="hero-buttons">
       <a href="#lokation" class="hero-btn"> Find lokation</a>

      <a href="#book bord" class="hero-btn">Book bord</a>
      </div>
    </div>

    <!-- Højre side: Kort-billedet -->
    <div class="hero-right">
      <img src="img/Component 1.png" alt="Spillekort">
    </div>
  </div>
</section>

<section class="filterbar">
     <p class="section-label">SPILBIBLIOTEK</p>
     <h2>Find dit næste spil</h2>
   <p class="spiloversigtekst">Søg efter et spil eller vælg en genre.</p>
       
        <!-- Øverste række: Søg og genre -->
    <form class="filter-row-main" role="search" >
    <label class="søg">
    <span>Søg efter spil</span>
   
    <input type="text" id="search-input" list="spilforslag" placeholder="Søg efter et spil..." 
     aria-label="Søg efter spil" /> 
   <datalist id="spilforslag"></datalist> </label>
       <select id="genre-select" aria-label="Kategori" >
      <option value="all">Vælg kategori</option>
    </select>
  </form>
</section>

  <p id="results-count" aria-live="polite"></p>

  <h2 class="games-heading">Spiloversigt</h2>
  <section id="game-list" aria-live="polite"></section>

<!-- Footer -->
<footer class="footer">
  <div class="footer-contact">
    <p>Kontakt os:</p>
    <p>Tlf: 43280913</p>
  </div>
</footer>
</main>


    <!-- Game Detail Modal -->
    <dialog id="game-dialog">
      <form method="dialog">
        <button id="close-dialog" aria-label="Close">✕</button>
        <div id="dialog-content">
          <!-- Game details will be injected here via JavaScript -->
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
